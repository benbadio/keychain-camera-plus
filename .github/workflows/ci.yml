name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Firmware Logic & Bootloader Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Stock ROM from Secret (if available)
        env:
          STOCK_ROM_BASE64: ${{ secrets.STOCK_ROM_BASE64 }}
        run: |
          if [ -n "$STOCK_ROM_BASE64" ]; then
            echo "[*] Restoring stock ROM from repository secret..."
            mkdir -p dumps
            echo "$STOCK_ROM_BASE64" | base64 -d > dumps/charmera_stock_latest.bin
            sha256sum dumps/charmera_stock_latest.bin
          else
            echo "[!] No STOCK_ROM_BASE64 secret found; stock-dependent tests will skip."
          fi

      - name: Run Pytest Regression Suite
        run: |
          pytest -v tests/
