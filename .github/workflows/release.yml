name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "[+] Building release for tag: ${TAG}"

      - name: Restore Stock ROM & Run Test Suite
        env:
          STOCK_ROM_BASE64: ${{ secrets.STOCK_ROM_BASE64 }}
        run: |
          if [ -n "$STOCK_ROM_BASE64" ]; then
            echo "[*] Restoring stock ROM from secret..."
            mkdir -p dumps
            echo "$STOCK_ROM_BASE64" | base64 -d > dumps/charmera_stock_latest.bin
            sha256sum dumps/charmera_stock_latest.bin
          else
            echo "[*] No STOCK_ROM_BASE64 secret provided; using verified release package."
          fi
          pytest -v tests/

      - name: Build Release Bundle
        env:
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          python scripts/build_release.py --tag "${RELEASE_TAG}" --outdir dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Keychain Camera Plus ${{ steps.tag_info.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/JH_5408*.bin
            dist/SHA256SUMS.txt
            dist/QUICKSTART.md
